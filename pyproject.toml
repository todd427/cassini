[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eip-cassini"
version = "0.5.0"
description = "Evidence Integrity Platform (EIP) - Extensible Evidence Assessment Architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "shapely>=2.0.6,<3.0.0",
    "pyshp>=2.3.1,<3.0.0",
]

[project.optional-dependencies]
osnma = [
    "ecdsa>=0.19.0,<1.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ecdsa>=0.19.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "policies*", "api*", "connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
